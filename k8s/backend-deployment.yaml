apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: job-portal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/your-org/job-portal-gateway:latest
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: job-portal-config
                  key: AUTH_SERVICE_URL
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: job-portal-config
                  key: USER_SERVICE_URL
            - name: JOB_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: job-portal-config
                  key: JOB_SERVICE_URL
            - name: APPLICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: job-portal-config
                  key: APPLICATION_SERVICE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: job-portal-secret
                  key: JWT_SECRET
            - name: INTERNAL_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: job-portal-secret
                  key: INTERNAL_SERVICE_KEY
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: job-portal-config
                  key: CORS_ORIGIN
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: job-portal
spec:
  selector:
    app: gateway
  ports:
    - port: 4000
      targetPort: 4000
