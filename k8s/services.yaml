apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-data
  namespace: job-portal
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: job-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/your-org/job-portal-auth-service:latest
          ports:
            - containerPort: 4001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4001"
            - name: DATABASE_URL
              value: file:./data/auth.db
            - name: USER_SERVICE_URL
              value: http://user-service:4003
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: job-portal-secret
                  key: JWT_SECRET
            - name: INTERNAL_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: job-portal-secret
                  key: INTERNAL_SERVICE_KEY
          volumeMounts:
            - name: database
              mountPath: /app/services/auth-service/prisma/data
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            periodSeconds: 20
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: auth-data
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: job-portal
spec:
  selector:
    app: auth-service
  ports:
    - port: 4001
      targetPort: 4001
---
