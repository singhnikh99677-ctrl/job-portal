apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: job-portal-ingress
  namespace: job-portal
spec:
  rules:
    - host: job-portal.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 4000
