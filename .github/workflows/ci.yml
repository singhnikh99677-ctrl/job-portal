name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret
      INTERNAL_SERVICE_KEY: ci-internal-key
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare SQLite schemas
        run: |
          node scripts/setup-env.mjs
          npm run prisma:generate
          npm run db:push

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Build gateway and service Docker images
        run: |
          for service in gateway services/auth-service services/user-service services/job-service services/application-service; do
            name=$(basename "$service")
            docker build -t ghcr.io/${{ github.repository_owner }}/job-portal-${name}:${{ github.sha }} \
              -f Dockerfile.service --build-arg SERVICE_PACKAGE="$service" .
          done

      - name: Build frontend Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/job-portal-frontend:${{ github.sha }} -f frontend/Dockerfile .

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker images to GHCR
        if: github.event_name != 'pull_request'
        run: |
          for service in gateway auth-service user-service job-service application-service; do
            image="ghcr.io/${{ github.repository_owner }}/job-portal-${service}"
            docker tag "$image:${{ github.sha }}" "$image:latest"
            docker push "$image:${{ github.sha }}"
            docker push "$image:latest"
          done
          docker tag ghcr.io/${{ github.repository_owner }}/job-portal-frontend:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/job-portal-frontend:latest
          docker push ghcr.io/${{ github.repository_owner }}/job-portal-frontend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/job-portal-frontend:latest
